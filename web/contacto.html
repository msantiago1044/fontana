<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto — Fontana</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>(function () { var t = localStorage.getItem('fontana_theme') || 'light'; var l = localStorage.getItem('fontana_lang') || 'es'; document.documentElement.setAttribute('data-theme', t); document.documentElement.setAttribute('lang', l); })();</script>
    <style>
        body {
            background: #0c1016;
            color: #f4f1ea;
            font-family: Inter, sans-serif;
            max-width: 720px;
            margin: 0 auto;
            padding: 80px 24px;
            line-height: 1.7;
        }

        h1 {
            font-family: Georgia, serif;
            color: #e8c873;
            margin-bottom: 8px;
        }

        p,
        li {
            color: #c9c6bc;
            font-size: 15px;
        }

        a {
            color: #e8c873;
        }

        .note {
            background: #1a2029;
            border-left: 3px solid #c9a14a;
            padding: 14px 18px;
            font-size: 13.5px;
            color: #e8c873;
            margin: 24px 0;
        }
    </style>
</head>

<body>
    <h1>Contacto</h1>
    <p>¿Tienes alguna pregunta o necesitas soporte? Escríbenos a:</p>
    <div class="note">
        <a href="mailto:fontanadigital.ai@gmail.com">fontanadigital.ai@gmail.com</a>
    </div>
    <p>Respondemos en un plazo de 24–48 horas hábiles.</p>
    <script src="/shared.js"></script>
</body>

</html>
